name: Build Android APK

on:
  workflow_dispatch:  # Chỉ chạy khi bấm nút thủ công
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            zlib1g-dev \
            liblzma-dev \
            openjdk-17-jdk \
            unzip

      - name: Install buildozer
        run: |
          pip install buildozer cython

      - name: Build APK
        run: |
          buildozer android debug
        env:
          GRADLE_OPTS: "-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autovisit-apk
          path: bin/*.apk
          if-no-files-found: error
